<script>
const SCHOOLS=['โรงเรียนบ้านนาสวรรค์','โรงเรียนบ้านโคกสวาง','โรงเรียนบ้านหนองตอ','โรงเรียนตชด.บ้านนาแวง','โรงเรียนเลิดสิน','โรงเรียนบ้านนาเจริญวิทยา','โรงเรียนบ้านดอนแก้วโนนอินทร์แปลง','โรงเรียนบ้านชุมภูทอง'];
const TYPES=['สามัญ','สมทบ ก','สมทบ ข','สมทบ ค'];
const MENU=[['home','house-fill','หน้าหลัก'],['members','people-fill','สมาชิก/หุ้น'],['loans','cash-coin','เงินกู้'],['monthly','calendar-check','ปิดยอดรายเดือน'],['welfare','heart-fill','สวัสดิการ'],['div','pie-chart-fill','ปันผล/เฉลี่ยคืน'],['books','calculator-fill','งบดุล/ตรวจบัญชี'],['expenses','receipt','ค่าใช้จ่าย'],['exits','person-dash-fill','ย้าย/ลาออก'],['docs','folder-fill','เอกสาร'],['sync','arrow-repeat','ซิงก์/ออฟไลน์'],['import','file-earmark-arrow-up-fill','นำเข้าข้อมูล','admin'],['settings','gear-fill','ตั้งค่า','admin'],['users','shield-lock-fill','ผู้ใช้']];
const SS={get(k){try{return localStorage.getItem('nsk_'+k)}catch(e){return window['_'+k]||null}},set(k,v){try{localStorage.setItem('nsk_'+k,v)}catch(e){window['_'+k]=v}},clear(){['t','u'].forEach(k=>{try{localStorage.removeItem('nsk_'+k)}catch(e){}});window._t=window._u=null}};
let TOKEN=SS.get('t')||'',USER=null;try{USER=JSON.parse(SS.get('u')||'null')}catch(e){}
const B=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const PCSS="body{font-family:'Sarabun','TH Sarabun New',Tahoma,sans-serif;font-size:15px;color:#222}.pg{padding:8px 14px}table{border-collapse:collapse;width:100%;margin:6px 0}td,th{border:1px solid #777;padding:4px 7px;vertical-align:top}th{background:#E8F5E9}.sg td{border:0;text-align:center;padding-top:28px}.c{text-align:center}.o{color:#E65100;font-weight:bold;font-size:19px}.g{color:#2E7D32;font-weight:bold;font-size:20px}.n{text-align:right}.b td{font-weight:bold;background:#FFF3E0}";
function printHtml(body){const w=window.open('','_blank');w.document.write('<html><head><meta charset="utf-8"><style>'+PCSS+'</style></head><body>'+body+'</body></html>');w.document.close();setTimeout(()=>w.print(),600)}
function out(title,html,cat){Swal.fire({title,icon:'success',showDenyButton:true,showCancelButton:true,confirmButtonText:'🖨 พิมพ์',denyButtonText:'☁ บันทึก PDF ลง Drive',cancelButtonText:'ปิด',confirmButtonColor:'#F57C00',denyButtonColor:'#2E7D32'}).then(async r=>{
  if(r.isConfirmed)printHtml(html);else if(r.isDenied){const d=await run('saveReport',{title,html,cat},'บันทึกลง Drive แล้ว');if(d)window.open(d.pdf,'_blank')}})}
const HEAD=t=>`<div class="c o">กองทุนสวัสดิการออมทรัพย์กลุ่มโรงเรียนนาสวรรค์คำนาดี</div><div class="c g">${t}</div>`;
const SIGN=a=>`<table class="sg"><tr>${a.map(x=>`<td>(ลงชื่อ) ……………………………<br>(${x[1]||'……………………………'})<br>${x[0]}</td>`).join('')}</tr></table>`;
const today=()=>new Date().toISOString().slice(0,10);
const EXCAT=['พัฒนากลุ่ม','ค่าตอบแทน','ค่าใช้จ่ายดำเนินงาน','จัดสรรสนับสนุน','สมทบช่วยเหลือ'];
const EXITR=['ย้ายออกนอกกลุ่ม','เกษียณอายุราชการ','เสียชีวิต','ลาออก','สิ้นสุดสัญญาจ้าง'];
let DB={Members:[],Loans:[]},dt=null,onSave=null;
const mdl=new bootstrap.Modal('#mdl');

/* ================= ออฟไลน์ + ซิงก์ ================= */
const isGAS=()=>!!(window.google&&google.script&&google.script.run);
const API=()=>{try{return localStorage.getItem('nsk_api')||''}catch(e){return ''}};
let Q=[],FAILED=[],FLP=Promise.resolve();const RES=new Map(),MEM={};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ck=(a,p)=>'c:'+a+'|'+JSON.stringify(p===undefined?null:p);
const sumk=(a,k)=>a.reduce((x,r)=>x+(+r[k]||0),0);
const toast=t=>Swal.fire({toast:true,position:'top',icon:'info',title:t,timer:2800,showConfirmButton:false});
let _db;const idb=()=>_db||(_db=new Promise((res,rej)=>{const q=indexedDB.open('nsk',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
async function kvGet(k){try{const d=await idb();return await new Promise(r=>{const t=d.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(undefined)})}catch(e){try{return JSON.parse(localStorage.getItem('nsk_kv_'+k))}catch(_){return MEM[k]}}}
async function kvSet(k,v){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=rej})}catch(e){try{localStorage.setItem('nsk_kv_'+k,JSON.stringify(v))}catch(_){MEM[k]=v}}}
async function kvClear(){try{const d=await idb();await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').clear();t.oncomplete=r})}catch(e){}try{Object.keys(localStorage).filter(k=>k.indexOf('nsk_kv_')==0).forEach(k=>localStorage.removeItem(k))}catch(e){}}
const lget=async s=>(await kvGet(ck('list',s)))||[],lset=(s,v)=>kvSet(ck('list',s),v);

function transport(a,p,t){
  p=p===undefined?null:p;
  if(isGAS())return new Promise(r=>google.script.run.withSuccessHandler(r).withFailureHandler(e=>r({ok:false,error:e.message,net:true})).api(a,p,t));
  const u=API();if(!u)return Promise.resolve({ok:false,error:'ยังไม่ได้ตั้งค่า URL ของ Web App (เมนูซิงก์/ออฟไลน์)',net:true});
  return fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:a,p,token:t}),redirect:'follow'}).then(r=>r.json()).catch(()=>({ok:false,error:'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้',net:true}))}

const QOK=['save','remove','createLoan','welfare'],RD=['list','dashboard','balance','dividend','formList','getSettings','listUsers'];
const WELF={'บาดเจ็บ':500,'เสียชีวิต':1000,'เกษียณอายุราชการ':1000,'ย้ายออกนอกกลุ่ม':500};
async function call(a,p){
  if(a==='login')return transport(a,p,'');
  if(QOK.includes(a))return enqueue(a,p);
  if(RD.includes(a)){const k=ck(a,p);
    if(navigator.onLine){if(Q.length)await flush();const r=await transport(a,p,TOKEN);if(r.ok){kvSet(k,r.data);return r}if(!r.net)return r}
    if(a==='dashboard')return{ok:true,data:await localDash(),offline:true};
    const c=await kvGet(k);return c!==undefined&&c!==null?{ok:true,data:c,offline:true}:{ok:false,error:'ออฟไลน์ และยังไม่มีข้อมูลสำรองของรายการนี้ในเครื่อง (ต้องเปิดครั้งแรกตอนมีอินเทอร์เน็ต)'}}
  if(!navigator.onLine)return{ok:false,error:'ฟังก์ชันนี้ต้องใช้อินเทอร์เน็ต (ปิดยอดเดือน นำเข้า สร้างเอกสาร Drive ฯลฯ)'};
  return transport(a,p,TOKEN)}
async function localDash(){const M=(await lget('Members')).filter(m=>m.status==='ใช้งาน'),L=(await lget('Loans')).filter(l=>l.status==='ผ่อนอยู่'),sc={};M.forEach(m=>sc[m.school]=(sc[m.school]||0)+1);
  return{members:M.length,shares:sumk(M,'shares'),loans:L.length,debt:sumk(L,'balance'),interest:sumk(await lget('Monthly'),'interest'),byYm:{},schools:sc}}
async function applyLocal(op){const{a,p}=op;
  if(a==='save'){const L=await lget(p.sheet),o=p.obj,i=L.findIndex(x=>String(x.id)==String(o.id));if(i>=0)L[i]={...L[i],...o};else L.push({...o});await lset(p.sheet,L);return{}}
  if(a==='remove'){await lset(p.sheet,(await lget(p.sheet)).filter(x=>String(x.id)!=String(p.id)));return{}}
  if(a==='createLoan'){const L=await lget('Loans'),amt=+p.amount,pe=p.kind==='พิเศษ'?10:Math.min(+p.periods||40,40);
    const prior=L.filter(l=>String(l.memberId)==String(p.memberId)&&l.kind==p.kind&&l.status=='ผ่อนอยู่'),po=sumk(prior,'balance');prior.forEach(l=>l.status='ปิด-กู้ใหม่');
    L.push({id:op.tid,memberId:p.memberId,kind:p.kind,date:p.date,amount:amt,ppp:Math.ceil(amt/pe),periods:pe,paid:0,balance:amt,g1:p.g1||'',g2:p.g2||'',status:'ผ่อนอยู่'});await lset('Loans',L);return{payoff:po,net:amt-po}}
  if(a==='welfare'){const L=await lget('Welfare');L.push({id:op.tid,date:p.date,memberId:p.memberId,type:p.type,amount:WELF[p.type]||0});await lset('Welfare',L);return{}}}
const sheetOf=o=>o.a=='createLoan'?'Loans':o.a=='welfare'?'Welfare':o.p.sheet;
async function refresh(op){const r=await transport('list',sheetOf(op),TOKEN);if(r.ok)await lset(sheetOf(op),r.data)}
async function enqueue(a,p){
  if(a==='save'&&p.sheet==='Members'){const n=Math.floor(+p.obj.shares/50);if(n<120)return{ok:false,error:'ต้องถือหุ้นอย่างน้อย 120 หุ้น (6,000 บาท) ตามข้อ 10'};if(n>400&&!p.obj.over400)return{ok:false,error:'เกิน 400 หุ้น ต้องได้รับความเห็นชอบจากคณะกรรมการ (แบบ ข-2)'}}
  const op={id:uid(),a,p:JSON.parse(JSON.stringify(p)),ts:Date.now(),u:USER&&USER.u};op.tid='c_'+uid();
  if(a==='save'&&!op.p.obj.id)op.p.obj.id=op.tid;
  const loc=await applyLocal(op);Q.push(op);await kvSet('q',Q);badge();
  if(navigator.onLine){await flush();const x=RES.get(op.id);RES.delete(op.id);
    if(x){if(!x.ok){FAILED=FAILED.filter(f=>f.id!=op.id);await kvSet('f',FAILED);badge();await refresh(op);return{ok:false,error:x.error}}
      if(x.map||a==='createLoan')await refresh(op);return{ok:true,data:x.data}}}
  return{ok:true,queued:true,data:{...(a==='save'?op.p.obj:{}),...loc,queued:true}}}
function flush(){return(FLP=FLP.then(doFlush,doFlush))}
async function doFlush(){
  if(!navigator.onLine||!TOKEN||!Q.length)return;
  const snap=Q.slice(),r=await transport('applyOps',{ops:snap},TOKEN);
  if(!r.ok){if(r.error=='SESSION'&&await reauth())return doFlush();return}
  const ids=new Set(snap.map(o=>o.id));Q=Q.filter(o=>!ids.has(o.id));
  r.data.results.forEach((x,i)=>{RES.set(x.id,x);if(!x.ok)FAILED.push({...snap[i],error:x.error})});
  const map=r.data.map||{};if(Object.keys(map).length){let s=JSON.stringify(Q);for(const t in map)s=s.split('"'+t+'"').join(JSON.stringify(map[t]));Q=JSON.parse(s)}
  await kvSet('q',Q);await kvSet('f',FAILED);await kvSet('last',Date.now());badge()}
